name: Docker image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shellcheck
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 *.sh

  build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image is built once and exported, so the pushed image is the one that was tested.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: |
            logrotate:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/image.tar"

      - name: Smoke test
        run: docker run --rm logrotate:test logrotate --version

  push:
    needs: [shellcheck, build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/image.tar"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker push "${tag}"
            fi
          done <<< "${TAGS}"
